<!DOCTYPE html>
<html>
<head>
    <title>Dll Injector</title>
    <HTA:APPLICATION
        ID="modgui"
        BORDER="thin"
        SCROLL="no"
        SINGLEINSTANCE="yes"
        WINDOWSTATE="normal"
    />
    <style>
        /* --- DARK NEON BACKGROUND --- */
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- LAVA LAMP ANIMATION --- */
        .lava-lamp {
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, #5f00ff, #220033);
            animation: lavaAnim 20s linear infinite alternate;
            z-index: -1;
        }

        @keyframes lavaAnim {
            0% { transform: scale(1) translate(0,0); }
            50% { transform: scale(1.2) translate(-10%,10%); }
            100% { transform: scale(1) translate(0,0); }
        }

        /* --- BUBBLES --- */
        .bubble {
            position: absolute;
            border-radius: 50%;
            opacity: 0.7;
            animation: floatUp linear infinite;
            background: rgba(255,0,0,0.6);
            box-shadow: 0 0 20px rgba(255,0,0,0.8);
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0.7; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* --- GLASS CARD --- */
        .glass-card {
            position: relative;
            width: 350px;
            padding: 30px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 40px rgba(255,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .glass-card h2 {
            margin: 0 0 10px 0;
            font-size: 26px;
            color: #ff0000;
            text-shadow: 0 0 10px #ff4444;
        }

        .glass-card p {
            margin: 5px 0;
            font-size: 14px;
            color: #ff8888;
        }

        /* --- BUTTONS --- */
        .btn {
            width: 80%;
            margin: 10px 0;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(90deg, #ff0000, #cc0000);
            color: #fff;
            text-shadow: 0 0 5px #ff0000;
        }

        .btn:hover {
            background: linear-gradient(90deg, #cc0000, #ff0000);
            transform: scale(1.05);
            box-shadow: 0 0 15px #ff0000;
        }
    </style>

    <script language="VBScript">
        Sub window_onload
            CenterWindow 450, 600
        End Sub

        Sub CenterWindow(w, h)
            window.resizeTo w, h
            window.moveTo (screen.availWidth - w) / 2, (screen.availHeight - h) / 2
        End Sub

        Sub click_btn(n)
            Dim fso, f
            Set fso = CreateObject("Scripting.FileSystemObject")
            Set f = fso.CreateTextFile("choice.var", True)
            f.Write n
            f.Close
            window.close
        End Sub
    </script>
</head>
<body>
    <div class="lava-lamp"></div>
    <div id="bubbles"></div>

    <div class="glass-card">
        <h2>XQRTO`s DLL Injector</h2>
        <p>Made by xqrto</p>
        <p>Powered by (xylo by xqrto)</p>

        <button class="btn" onclick="click_btn(1)">Inject</button>
        <button class="btn" onclick="click_btn(2)">Select Process</button>
        <button class="btn" onclick="click_btn(3)">Remove DLL</button>
        <button class="btn" onclick="click_btn(4)">Add DLL</button>
        <button class="btn" onclick="click_btn(5)">About</button>
    </div>

    <script>
        function createBubble() {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = Math.random() * 20 + 10;
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.left = Math.random() * window.innerWidth + 'px';
            bubble.style.animationDuration = (Math.random() * 5 + 5) + 's';
            document.getElementById('bubbles').appendChild(bubble);

            setTimeout(() => {
                bubble.remove();
            }, 10000);
        }
        setInterval(createBubble, 200);
    </script>
</body>
</html>
