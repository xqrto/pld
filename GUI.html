<!DOCTYPE html>
<html>
<head>
    <title>Mod Loader by xqrto</title>
    <HTA:APPLICATION
        ID="modgui"
        BORDER="thin"
        SCROLL="no"
        SINGLEINSTANCE="yes"
        WINDOWSTATE="normal"
    />
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #0a0a0a;
            color: #ff0000;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h2 {
            margin-top: 0;
            font-size: 28px;
            color: #ff0000;
        }

        p {
            margin: 5px 0;
            font-size: 14px;
        }

        hr {
            border: 1px solid #ff0000;
            margin: 20px 0;
        }

        .btn {
            width: 70%;
            margin: 8px 0;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(90deg, #ff0000, #cc0000);
            color: #000;
        }

        .btn:hover {
            background: linear-gradient(90deg, #cc0000, #ff0000);
            transform: scale(1.05);
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #cc0000;
        }
    </style>

    <script language="VBScript">
        Sub window_onload
            CenterWindow 450, 600
        End Sub

        Sub CenterWindow(w, h)
            window.resizeTo w, h
            window.moveTo (screen.availWidth - w) / 2, (screen.availHeight - h) / 2
        End Sub

        Sub click_btn(n)
            Dim fso, f
            Set fso = CreateObject("Scripting.FileSystemObject")
            Set f = fso.CreateTextFile("choice.var", True)
            f.Write n
            f.Close
            window.close
        End Sub
    </script>
</head>
<body>
    <h2>XQRTO`s</h2>
    <p>DLL Injector</p>
    <p>Made by xqrto</p>
    <p>Powered by (xylo by xqrto)</p>
    <hr>

    <button class="btn" onclick="click_btn(1)">Inject (1)</button><br>
    <button class="btn" onclick="click_btn(2)">Select Process (2)</button><br>
    <button class="btn" onclick="click_btn(3)">Remove DLL (3)</button><br>
    <button class="btn" onclick="click_btn(4)">Add DLL (4)</button><br>
    <button class="btn" onclick="click_btn(5)">About (5)</button>

</body>
</html>
